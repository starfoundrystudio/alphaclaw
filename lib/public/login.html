<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>clawbridge</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="./img/logo.svg" />
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/tailwind.generated.css" />
    <script>
      try {
        var t = localStorage.getItem("alphaclaw.ui.theme");
        if (t === "system") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        else if (t !== "dark" && t !== "light") t = "dark";
        document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-sm w-full relative z-10">
      <div class="text-center mb-6">
        <img
          src="./img/logo.svg"
          alt="clawbridge"
          class="mx-auto mb-4"
          width="48"
          height="49"
        />
        <h1 class="text-2xl font-semibold mb-2">
          <span style="color: var(--accent)">claw</span>bridge
        </h1>
        <p style="color: var(--text-muted)" class="text-xs mb-4">
          OpenClaw made easy
        </p>
      </div>
      <div
        id="teamyou-panel"
        class="bg-surface border border-border rounded-xl p-4 space-y-3 hidden"
      >
        <p id="teamyou-message" class="text-sm text-center" style="color: var(--text)"></p>
        <a
          id="teamyou-open"
          href="#"
          class="block w-full text-center text-sm font-medium px-4 py-2 rounded-lg ac-btn-primary"
        >
          Open from TeamYou
        </a>
        <button
          id="use-password"
          type="button"
          class="w-full text-xs hidden"
          style="color: var(--text-muted)"
        >
          Use setup password instead
        </button>
      </div>
      <form
        id="login-form"
        autocomplete="on"
        class="bg-surface border border-border rounded-xl p-4 space-y-3 hidden"
      >
        <input
          type="text"
          name="username"
          value="alphaclaw-setup"
          autocomplete="username"
          class="hidden"
          tabindex="-1"
          aria-hidden="true"
        />
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          autofocus
          class="w-full bg-field border border-border rounded-lg px-3 py-2 text-sm outline-none focus:border-fg-muted"
          style="color: var(--text)"
        />
        <div id="error" class="text-status-error-muted text-xs hidden"></div>
        <button
          id="submit-btn"
          type="submit"
          disabled
          class="w-full text-sm font-medium px-4 py-2 rounded-lg ac-btn-primary"
        >
          Enter
        </button>
      </form>
    </div>
    <script>
      // Managed instances sign in through TeamYou; the password form is only
      // for self-hosted installs (and the transition while both exist).
      const kSsoMessages = {
        invalid:
          "That sign-in link isn't valid. Open Clawbridge from TeamYou to try again.",
        expired:
          "That sign-in link expired. Open Clawbridge from TeamYou to get a new one.",
        used: "That sign-in link was already used. Open Clawbridge from TeamYou to get a new one.",
        wrong_instance: "That sign-in link is for a different instance.",
        wrong_address:
          "That sign-in link is for a different address. Open Clawbridge from TeamYou again.",
        throttled:
          "Too many sign-in attempts. Wait a minute, then open Clawbridge from TeamYou again.",
        unavailable: "Sign-in is temporarily unavailable. Try again in a moment.",
      };
      const kSignedOutMessage = "You're signed out.";

      const panelEl = document.getElementById("teamyou-panel");
      const panelMessageEl = document.getElementById("teamyou-message");
      const openLinkEl = document.getElementById("teamyou-open");
      const usePasswordEl = document.getElementById("use-password");
      const loginFormEl = document.getElementById("login-form");

      const showPasswordForm = () => {
        loginFormEl.classList.remove("hidden");
        document.getElementById("password").focus();
      };

      const buildEntryUrl = (entryUrl) => {
        const url = new URL(entryUrl);
        const tabMatch = /^#\/([a-z]+)/.exec(window.location.hash || "");
        if (tabMatch) url.searchParams.set("return_to", `/#/${tabMatch[1]}`);
        return url.toString();
      };

      const initSignIn = async () => {
        const params = new URLSearchParams(window.location.search);
        const ssoError = params.get("sso_error") || "";
        const signedOut = params.get("signed_out") === "1";
        let status = null;
        try {
          const res = await fetch("/api/auth/status", { cache: "no-store" });
          status = await res.json();
        } catch {}
        if (status?.identity) {
          window.location.replace("/");
          return;
        }
        const entryUrl = status?.methods?.teamyou?.entryUrl || "";
        if (!entryUrl) {
          showPasswordForm();
          return;
        }
        const target = buildEntryUrl(entryUrl);
        if (!ssoError && !signedOut) {
          window.location.replace(target);
          return;
        }
        panelMessageEl.textContent = signedOut
          ? kSignedOutMessage
          : kSsoMessages[ssoError] || kSsoMessages.invalid;
        openLinkEl.href = target;
        panelEl.classList.remove("hidden");
        if (status?.methods?.password) {
          usePasswordEl.classList.remove("hidden");
          usePasswordEl.addEventListener("click", () => {
            usePasswordEl.classList.add("hidden");
            showPasswordForm();
          });
        }
      };
      initSignIn();

      const formEl = document.getElementById("login-form");
      const passwordEl = document.getElementById("password");
      const submitButtonEl = document.getElementById("submit-btn");

      const syncButtonState = () => {
        const hasValue = passwordEl.value.length > 0;
        submitButtonEl.disabled = !hasValue;
      };

      passwordEl.addEventListener("input", syncButtonState);

      const setPendingState = (isPending) => {
        submitButtonEl.disabled = isPending;
        submitButtonEl.classList.toggle("opacity-70", isPending);
        submitButtonEl.classList.toggle("cursor-not-allowed", isPending);
      };

      formEl.addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = document.getElementById("password").value;
        const errorEl = document.getElementById("error");
        errorEl.classList.add("hidden");
        setPendingState(true);
        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password }),
          });
          const data = await res.json();
          if (data.ok) {
            window.location.href = "/";
          } else {
            if (res.status === 429) {
              const retryAfterFromHeader = Number.parseInt(
                res.headers.get("retry-after") || "0",
                10,
              );
              const retryAfterSec =
                Number.isFinite(data.retryAfterSec) && data.retryAfterSec > 0
                  ? data.retryAfterSec
                  : Number.isFinite(retryAfterFromHeader) &&
                      retryAfterFromHeader > 0
                    ? retryAfterFromHeader
                    : 30;
              errorEl.textContent = `Too many attempts. Try again in ${retryAfterSec}s.`;
            } else {
              errorEl.textContent = data.error || "Login failed";
            }
            errorEl.classList.remove("hidden");
          }
        } catch {
          errorEl.textContent = "Connection error";
          errorEl.classList.remove("hidden");
        } finally {
          setPendingState(false);
        }
      });
    </script>
  </body>
</html>
